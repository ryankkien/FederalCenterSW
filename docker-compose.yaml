services:
  postgres:
    image: postgres:16-alpine
    container_name: fcsw-postgres-local
    environment:
      POSTGRES_DB: federal_center_sw
      POSTGRES_USER: fcadmin
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fcadmin -d federal_center_sw"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - fcsw_postgres_data:/var/lib/postgresql/data

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.35.0
    container_name: fcsw-azurite-local
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('net').connect(10000, '127.0.0.1').on('connect', function(){process.exit(0)}).on('error', function(){process.exit(1)})\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - fcsw_azurite_data:/data

  summarizer:
    build: ./summarizer
    container_name: fcsw-summarizer-local
    ports:
      - "8001:8000"
    environment:
      # Points at the local Azurite emulator
      AZURE_STORAGE_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tiqnu3RcQxKqHE9R1LtNYBPA==;BlobEndpoint=http://azurite:10000/devstoreaccount1;"
      AZURE_STORAGE_CONTAINER: app-assets
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      MODEL_PREFERENCE: ${MODEL_PREFERENCE:-claude}
      DATABASE_URL: postgresql://fcadmin:local_dev_password@postgres:5432/federal_center_sw
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
    depends_on:
      azurite:
        condition: service_healthy
      postgres:
        condition: service_healthy

volumes:
  fcsw_postgres_data:
  fcsw_azurite_data:
