[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "federal-center-sw-api"
version = "0.1.0"
description = "FastAPI backend for Federal Center SW."
requires-python = ">=3.8"
dependencies = [
  "fastapi==0.110.3",
  "uvicorn[standard]==0.30.6",
  "python-dotenv==1.0.1",
  "python-multipart==0.0.9",
  "sqlalchemy==2.0.41",
  "psycopg[binary]==3.1.18",
  "alembic==1.14.1",
  "azure-storage-blob==12.24.1",
  "PyMuPDF==1.24.11",
  "openpyxl==3.1.5",
]

[project.optional-dependencies]
dev = [
  "httpx==0.27.2",
  "pytest==8.3.5",
  "ruff==0.11.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py38"
