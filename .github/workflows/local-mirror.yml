name: Local Mirror

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'compose.yaml'
      - 'scripts/local-*.sh'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/local-mirror.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend workspace tooling
        run: bun install --frozen-lockfile

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Validate Compose config
        run: docker compose config

      - name: Start local mirror
        run: bun run local:up

      - name: Run backend tests
        run: python -m pytest backend/tests

      - name: Stop local mirror
        if: always()
        run: bun run local:down
