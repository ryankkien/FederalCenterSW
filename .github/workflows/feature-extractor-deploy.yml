name: Feature Extractor Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'feature_extractor/**'
      - '.github/workflows/feature-extractor-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  ACR_NAME: ${{ vars.ACR_NAME || 'fcswdevacr' }}
  ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER || 'fcswdevacr.azurecr.io' }}
  ACA_APP_NAME: ${{ vars.FEATURE_EXTRACTOR_APP_NAME || 'fcsw-feature-extractor-dev' }}
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'federal-center-sw-dev' }}
  AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID || '99596387-8247-4e94-9917-cf8bc695f106' }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: azure-dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check deployment configuration
        id: deploy_config
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
        run: |
          missing=""
          if [ -z "$AZURE_CLIENT_ID" ]; then
            missing="$missing AZURE_CLIENT_ID"
          fi

          if [ -n "$missing" ]; then
            echo "::notice::Skipping Feature Extractor deploy; missing GitHub configuration:$missing"
            echo "deploy_ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy_ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Azure login
        if: steps.deploy_config.outputs.deploy_ready == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID || 'c821732f-0ded-4db0-96c8-cf2013d16974' }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Check Azure resources
        id: azure_resources
        if: steps.deploy_config.outputs.deploy_ready == 'true'
        run: |
          if ! az acr show --name "$ACR_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --only-show-errors >/dev/null; then
            echo "::notice::Skipping Feature Extractor deploy; ACR $ACR_NAME is not available."
            echo "deploy_ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! az containerapp show --name "$ACA_APP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --only-show-errors >/dev/null; then
            echo "::notice::Skipping Feature Extractor deploy; Container App $ACA_APP_NAME is not available."
            echo "deploy_ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "deploy_ready=true" >> "$GITHUB_OUTPUT"

      - name: Log in to ACR
        if: steps.deploy_config.outputs.deploy_ready == 'true' && steps.azure_resources.outputs.deploy_ready == 'true'
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Build and push image
        if: steps.deploy_config.outputs.deploy_ready == 'true' && steps.azure_resources.outputs.deploy_ready == 'true'
        run: |
          IMAGE="${{ env.ACR_LOGIN_SERVER }}/feature-extractor"
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" feature_extractor/
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - name: Deploy to Container App
        if: steps.deploy_config.outputs.deploy_ready == 'true' && steps.azure_resources.outputs.deploy_ready == 'true'
        run: |
          az containerapp update \
            --name "$ACA_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --image "${{ env.ACR_LOGIN_SERVER }}/feature-extractor:${{ github.sha }}"
