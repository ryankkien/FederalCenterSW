name: Backend Worker Function Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/function-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AZURE_FUNCTION_APP_NAME: ${{ vars.AZURE_FUNCTION_APP_NAME || 'fcsw-email-intake-e7e9f2' }}
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'federal-center-sw-dev' }}
  AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID || '99596387-8247-4e94-9917-cf8bc695f106' }}
  AZURE_STORAGE_CONTAINER: ${{ vars.AZURE_STORAGE_CONTAINER || 'app-assets' }}
  APPINSIGHTS_COMPONENT_NAME: ${{ vars.APPINSIGHTS_COMPONENT_NAME || 'fcsw-dev-aca-env-appi' }}
  EMAIL_INTAKE_DEFAULT_DOCUMENT_TYPE: ${{ vars.EMAIL_INTAKE_DEFAULT_DOCUMENT_TYPE || 'Email Attachment' }}
  EMAIL_INTAKE_DEFAULT_UPLOADER_ID: ${{ vars.EMAIL_INTAKE_DEFAULT_UPLOADER_ID || 'contractor-demo' }}
  DOCUMENT_PROCESSING_TIMER_SCHEDULE: ${{ vars.DOCUMENT_PROCESSING_TIMER_SCHEDULE || '0 */5 * * * *' }}
  DOCUMENT_PROCESSING_LIMIT: ${{ vars.DOCUMENT_PROCESSING_LIMIT || '25' }}
  EMAIL_INTAKE_TIMER_SCHEDULE: ${{ vars.EMAIL_INTAKE_TIMER_SCHEDULE || '0 */3 * * * *' }}
  PORTFOLIO_LESSONS_TIMER_SCHEDULE: ${{ vars.PORTFOLIO_LESSONS_TIMER_SCHEDULE || '0 15 */6 * * *' }}
  PORTFOLIO_LESSONS_PERIOD: ${{ vars.PORTFOLIO_LESSONS_PERIOD || 'fy26' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: azure-dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Test backend
        run: python -m pytest backend/tests

      - name: Check deployment configuration
        id: deploy_config
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
        run: |
          missing=""
          if [ -z "$AZURE_CLIENT_ID" ]; then
            missing="$missing AZURE_CLIENT_ID"
          fi

          if [ -n "$missing" ]; then
            echo "::notice::Skipping Function App deploy; missing GitHub configuration:$missing"
            echo "deploy_ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy_ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Azure login
        if: steps.deploy_config.outputs.deploy_ready == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID || 'c821732f-0ded-4db0-96c8-cf2013d16974' }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Configure non-secret Function App settings
        if: steps.deploy_config.outputs.deploy_ready == 'true'
        run: |
          az functionapp config appsettings set \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_FUNCTION_APP_NAME" \
            --settings \
              AZURE_STORAGE_CONTAINER="$AZURE_STORAGE_CONTAINER" \
              EMAIL_INTAKE_DEFAULT_UPLOADER_ID="$EMAIL_INTAKE_DEFAULT_UPLOADER_ID" \
              EMAIL_INTAKE_DEFAULT_DOCUMENT_TYPE="$EMAIL_INTAKE_DEFAULT_DOCUMENT_TYPE" \
              DOCUMENT_PROCESSING_TIMER_SCHEDULE="$DOCUMENT_PROCESSING_TIMER_SCHEDULE" \
              DOCUMENT_PROCESSING_LIMIT="$DOCUMENT_PROCESSING_LIMIT" \
              EMAIL_INTAKE_TIMER_SCHEDULE="$EMAIL_INTAKE_TIMER_SCHEDULE"
              PORTFOLIO_LESSONS_TIMER_SCHEDULE="$PORTFOLIO_LESSONS_TIMER_SCHEDULE" \
              PORTFOLIO_LESSONS_PERIOD="$PORTFOLIO_LESSONS_PERIOD"

      - name: Configure Function App observability setting
        if: steps.deploy_config.outputs.deploy_ready == 'true'
        run: |
          APPINSIGHTS_CONNECTION_STRING="$(az monitor app-insights component show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --app "$APPINSIGHTS_COMPONENT_NAME" \
            --query connectionString \
            --output tsv)"

          if [ -z "$APPINSIGHTS_CONNECTION_STRING" ]; then
            echo "::error::Application Insights connection string was not found."
            exit 1
          fi

          az functionapp config appsettings set \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_FUNCTION_APP_NAME" \
            --settings \
              APPINSIGHTS_CONNECTION_STRING="$APPINSIGHTS_CONNECTION_STRING" \
              APPLICATIONINSIGHTS_CONNECTION_STRING="$APPINSIGHTS_CONNECTION_STRING"

      - name: Install production dependencies into package
        if: steps.deploy_config.outputs.deploy_ready == 'true'
        run: |
          pip install \
            --requirement backend/requirements.txt \
            --target backend/.python_packages/lib/site-packages

      - name: Deploy Function App
        if: steps.deploy_config.outputs.deploy_ready == 'true'
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTION_APP_NAME }}
          package: backend
          respect-funcignore: true
