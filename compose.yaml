services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: fcsw-postgres-local
    environment:
      POSTGRES_DB: federal_center_sw
      POSTGRES_USER: fcadmin
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fcadmin -d federal_center_sw"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - fcsw_postgres_data:/var/lib/postgresql/data

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.35.0
    container_name: fcsw-azurite-local
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('net').connect(10000, '127.0.0.1').on('connect', function(){process.exit(0)}).on('error', function(){process.exit(1)})\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - fcsw_azurite_data:/data

  backend:
    build: ./backend
    container_name: fcsw-backend-local
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://fcadmin:local_dev_password@postgres:5432/federal_center_sw
      AZURE_STORAGE_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;"
      AZURE_STORAGE_CONTAINER: app-assets
      AUTH_MODE: ${AUTH_MODE:-mock}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-dev-only-auth-secret-change-me}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-local-dev-internal-token}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_LLM_MODEL: ${OPENAI_LLM_MODEL:-gpt-4o-mini}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      AI_PROCESSING_ENABLED: ${AI_PROCESSING_ENABLED:-false}
      AI_INLINE_PROCESSING_ENABLED: ${AI_INLINE_PROCESSING_ENABLED:-false}
      FEATURE_EXTRACTOR_URL: ${FEATURE_EXTRACTOR_URL:-http://feature_extractor:8000}
      FEATURE_EXTRACTOR_REQUEST_TIMEOUT_SECONDS: ${FEATURE_EXTRACTOR_REQUEST_TIMEOUT_SECONDS:-120}
    depends_on:
      azurite:
        condition: service_healthy
      postgres:
        condition: service_healthy

  feature_extractor:
    build: ./feature_extractor
    container_name: fcsw-feature-extractor-local
    ports:
      - "8001:8000"
    environment:
      # Points at the local Azurite emulator
      AZURE_STORAGE_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;"
      AZURE_STORAGE_CONTAINER: app-assets
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_LLM_MODEL: ${OPENAI_LLM_MODEL:-gpt-5.4-mini}
      DATABASE_URL: postgresql://fcadmin:local_dev_password@postgres:5432/federal_center_sw
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      BACKEND_API_URL: http://backend:8000
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-local-dev-internal-token}
    depends_on:
      azurite:
        condition: service_healthy
      postgres:
        condition: service_healthy

volumes:
  fcsw_postgres_data:
  fcsw_azurite_data:
